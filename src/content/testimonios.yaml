- id: carlos-humberto-triana-herrera
  orden: 2
  nombre: Carlos Humberto Triana Herrera
  # Ya no está en la compañía (se jubiló): se mantiene el testimonio sin sus años en la casa ni su cargo actual
  # (decisión del 20-oct). Fragmento y cita recortados del original, con las omisiones marcadas.
  cargo: { es: Exgerente de ECOHL, en: Former ECOHL Manager }
  foto: ../assets/testimonios/carlos-humberto-triana-herrera.jpg
  autorizado: false
  fragmento:
    es: Ingeniero mecánico con maestría en administración con especialización en gerencia y dirección de proyectos. Con más de 37 años de experiencia en el sector de la construcción pesada […]
    en: Mechanical engineer with a master's in business administration specializing in project management. With more than 37 years of experience in heavy construction […]
  confirmar: ["Fragmento: validar con la autorización (ya no está en la compañía)"]
  cita:
    es: "Ingeniero mecánico con maestría en administración con especialización en gerencia y dirección de proyectos. Con más de 37 años de experiencia en el sector de la construcción pesada; […] gerente de ECOHL […], empresa del grupo encargada de atender nuestros clientes en servicios EPCM, gerencias de proyecto, interventoría, comisionamiento, administración de contratos y gerencia de riesgos."
    en: "Mechanical engineer with a master's in business administration specializing in project management. With more than 37 years of experience in heavy construction; […] ECOHL manager […], the group company that serves our clients with EPCM services, project management, inspection and oversight, commissioning, contract administration and risk management."
- id: carlos-abel-leon-martinez
  orden: 3
  nombre: Carlos Abel León Martínez
  cargo: { es: Director de Operaciones, en: Director of Operations }
  foto: ../assets/testimonios/carlos-abel-leon-martinez.jpg
  autorizado: false
  anios: 15
  aniosMas: true
  fragmento:
    es: Han pasado más de 15 años desde que entré a la compañía […] Hoy entiendo que todo este recorrido ha valido la pena, he logrado una estabilidad económica y emocional gracias a las oportunidades laborales y profesionales que me ha brindado la compañía […]
    en: It has been more than 15 years since I joined the company […] Today I understand that the whole journey has been worth it; I have achieved financial and emotional stability thanks to the work and professional opportunities the company has given me […]
  confirmar: ["Fragmento y años en la casa: validar con la autorización"]
  cita:
    es: Han pasado más de 15 años desde que entré a la compañía, nunca he escrito un testimonio y a decir verdad hoy siento la necesidad de hacerlo y expresar la admiración que siento por quienes forjaron e inculcaron dentro de la organización unos inquebrantables valores corporativos. Hoy entiendo que todo este recorrido ha valido la pena, he logrado una estabilidad económica y emocional gracias a las oportunidades laborales y profesionales que me ha brindado la compañía, agradezco a los accionistas, directivos y a todos los conformantes de la organización por permitirme ser parte de ella.
    en: "It has been more than 15 years since I joined the company. I have never written a testimonial, and to be honest, today I feel the need to do so and to express my admiration for those who forged and instilled unbreakable corporate values within the organization. Today I understand that the whole journey has been worth it; I have achieved financial and emotional stability thanks to the work and professional opportunities the company has given me. I thank the shareholders, the executives and everyone in the organization for letting me be part of it."
- id: jairo-armando-saenz
  orden: 4
  nombre: Jairo Armando Sáenz
  cargo: { es: Coordinador de Compras, en: Purchasing Coordinator }
  foto: ../assets/testimonios/jairo-armando-saenz.jpg
  autorizado: false
  fragmento:
    es: "[…] es un orgullo para mí hacer parte de esta importante organización en la cual he crecido y me he sentido en familia […] En el Grupo HL sí nos ven como seres humanos. Vamos para adelante."
    en: "[…] I am proud to be part of this important organization, where I have grown and felt like family […] At Grupo HL they truly see us as human beings. Onward."
  confirmar: ["Fragmento: validar con la autorización"]
  cita:
    es: Durante el tiempo que llevo trabajando para el Grupo HL, considero que es la única organización de nuestro tipo que antes de pensar en su beneficio, piensa en el beneficio de sus empleados, de sus clientes y su buen nombre; por tal motivo es un orgullo para mí hacer parte de esta importante organización en la cual he crecido y me he sentido en familia, me ha dado múltiples oportunidades de desarrollarme como un gran ser humano, un gran profesional y el afianzar los principios y respetos por los demás. En el Grupo HL sí nos ven como seres humanos. Vamos para adelante.
    en: "In my time working for Grupo HL, I believe it is the only organization of its kind that, before thinking of its own benefit, thinks of the benefit of its employees, its clients and its good name; that is why I am proud to be part of this important organization, where I have grown and felt like family. It has given me many opportunities to develop as a human being and as a professional, and to strengthen my principles and respect for others. At Grupo HL they truly see us as human beings. Onward."
