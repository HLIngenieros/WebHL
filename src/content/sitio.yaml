# Datos generales del sitio. La edad se calcula desde `fundacion`; nunca se escribe fija.
- id: hl
  fundacion: 1968
  # Lema único (D2, guía §2.3). El EN se cerró en F5 (20-oct).
  lema:
    es: Construimos la industria con gente que cumple, desde 1968.
    en: Building industry with people who deliver, since 1968.
  # Países con obra: los nombra el texto "Ejecutamos los proyectos de forma diferente" del inicio actual
  # (contenido/institucional.md §1). Las fichas solo registran CO, EC, GT y PA.
  paises: [CO, PA, CR, DO, GT, BO, EC]
  cifras:
    - { valor: 530, prefijo: '+', etiqueta: { es: Proyectos ejecutados, en: Projects completed } }
    - { valor: 4000000, prefijo: '+', unidad: hh, etiqueta: { es: Horas hombre al año, en: Man-hours per year } }
    - { valor: 7, etiqueta: { es: Países con obra, en: Countries with projects } }
    - { valor: 4, etiqueta: { es: Sedes, en: Offices } }
  # Empresas del grupo (D1: falta decidir cuáles se muestran). Ninguna se publica hasta `aprobada: true`.
  # Megacranes y Aktino ya salieron del grupo (20-oct): no se incluyen. HL Infraestructura ejecuta las obras y
  # tendrá el protagonismo (falta su información); HL Panamá y HL Rental siguen, con protagonismo muy reducido.
  # Logos del sitio actual; descripción solo si existe (la de ECOHL, del testimonio de su gerente).
  asociadas:
    - nombre: ECOHL
      logo: ../assets/grupo/ecohl.png
      area: { es: Gerencia · EPCM, en: Management · EPCM }
      descripcion: { es: "Servicios EPCM, gerencias de proyecto, interventoría, comisionamiento, administración de contratos y gerencia de riesgos.", en: "EPCM services, project management, inspection and oversight, commissioning, contract administration and risk management." }
      aprobada: false
    - { nombre: HL Infraestructura, logo: ../assets/grupo/hl-infraestructura.png, area: { es: Infraestructura, en: Infrastructure }, aprobada: false }
    - { nombre: HL Panamá, logo: ../assets/grupo/hl-panama.png, area: { es: Panamá, en: Panama }, aprobada: false }
    - { nombre: HL Rental, logo: ../assets/grupo/hl-rental.png, aprobada: false }
  redes:
    - { red: LinkedIn, url: 'https://www.linkedin.com/company/hl-ingenieros-sa' }
  # Logos de la portada actual. Sin First Quantum / Cobre Panamá: es cliente de un caso discreto (D6).
  clientes:
    - { nombre: Emgesa, logo: ../assets/clientes/emgesa.png }
    - { nombre: Drummond, logo: ../assets/clientes/drummond.png }
    - { nombre: Argos, logo: ../assets/clientes/argos.png }
    - { nombre: Continental Gold, logo: ../assets/clientes/continental-gold.png }
    - { nombre: Cemex, logo: ../assets/clientes/cemex.png }
    - { nombre: Ladrillera Santafé, logo: ../assets/clientes/ladrillera-santafe.png }
    - { nombre: Unilever, logo: ../assets/clientes/unilever.png }
    - { nombre: OHL Industrial, logo: ../assets/clientes/ohl-industrial.png }
    - { nombre: Vopak, logo: ../assets/clientes/vopak.png }
    - { nombre: Peldar, logo: ../assets/clientes/peldar.png }
    - { nombre: Colsubsidio, logo: ../assets/clientes/colsubsidio.png }
    - { nombre: Diana Pet Food, logo: ../assets/clientes/diana-pet-food.png }
    - { nombre: Cerrejón, logo: ../assets/clientes/cerrejon.png }
    - { nombre: Bolsa y Mercados de Valores de la República Dominicana, logo: ../assets/clientes/bolsa-valores-rd.png }
    - { nombre: Hyundai Heavy Industries, logo: ../assets/clientes/hyundai.png }
    - { nombre: Grupo Prodeco, logo: ../assets/clientes/prodeco.png }
    - { nombre: Oxy, logo: ../assets/clientes/oxy.png }
    - { nombre: Chevron, logo: ../assets/clientes/chevron.png }
  # D7: buzones por función (sin correos personales). El PHP los lee de /api/config.json al compilar.
  contacto:
    buzones:
      cotizacion: cotizaciones@hlingenieros.com
      proveedor: proveedores@hlingenieros.com
      empleo: talento@hlingenieros.com
      etico: buzonetico@hlingenieros.com
    confirmado: false
  confirmar:
    - "D7: confirmar que existen los buzones cotizaciones@, proveedores@, talento@ y buzonetico@ (o indicar los reales)."
    - "Vacantes (congelado por decisión de Juan David, 21-oct; sigue con Power Automate): crear la lista \"Vacantes\" en SharePoint y el flujo de Power Automate que publica /api/vacantes.json en el hosting (requiere acceso FTP/SFTP)."
    - "Remitente no-reply@hlingenieros.com autorizado en SPF/DKIM y prueba de envío (mail) en el hosting."
    - "Agente (D3): proveedor de IA de producción (Gerencia y TI: Claude en Microsoft Foundry o Azure OpenAI; comparativo en la guía del agente §3) y su clave en el .env del hosting (hl-privado/, fuera de public_html)."
    - "Hosting: confirmar que el PHP puede llamar por HTTPS a la API del modelo (cURL saliente) y el tiempo máximo de ejecución."
    - "Documentos: certificados ISO 9001, 14001 y 45001 en PDF (Calidad/SGS) para public/documentos/certificaciones/."
    - "Jurídica: validar un aviso para la política de datos (ES/EN) sobre el asistente: responde con IA del proveedor elegido (D3), no guarda conversaciones ni pide datos; y sobre las cookies de Zoho SalesIQ, que solo se cargan al pasar con un asesor."
    - "Zoho SalesIQ (D3): widgetcode de la marca del sitio, departamento Comercial con regla de enrutamiento, horario y aviso de datos (guía del agente §4)."
    - "Número de WhatsApp comercial al que deriva el asistente (y si es uno por país)."
    - "Cifras de portada de 2020 (+530 proyectos, +4.000.000 HH al año): actualizar."
    - "¿Bolsa y Mercados de Valores de la República Dominicana es cliente?"
    - "Logos de clientes: ¿se mantienen los 18 y se agregan clientes 2020-2026?"
    - "HL Infraestructura (la empresa que ejecuta las obras): desde cuándo existe, qué hace, personal y equipos propios, y qué proyectos ejecutó."
    - "Proyectos 2020-2026: ninguna ficha publicada es posterior a enero de 2020. Enviar cliente, años, alcance y cifras de los recientes."
